<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Noir | Web Play</title>
    <style>
        :root {
            --bg-noir: #0a0b0d;
            --bg-card: rgba(22, 24, 28, 0.8);
            --border-noir: #2c2f33;
            --accent-primary: #5865f2;
            --accent-mafia: #ed4245;
            --accent-town: #57f287;
            --accent-day: #faa61a;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-noir);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 1.5s ease;
        }

        /* --- Phase Gradients --- */
        body.phase-night { background: radial-gradient(circle at center, #1a1c22 0%, #050507 100%); }
        body.phase-day { background: radial-gradient(circle at top, #2c2417 0%, #0a0b0d 100%); }
        body.phase-ended { background: radial-gradient(circle at center, #1b271d 0%, #0a0b0d 100%); }

        /* --- Header --- */
        header {
            padding: 15px 25px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-noir);
            z-index: 100;
        }

        .game-info { display: flex; align-items: center; gap: 15px; }
        .phase-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .phase-night .phase-badge { background: #1e1f22; border: 1px solid #3f4147; color: #fff; }
        .phase-day .phase-badge { background: var(--accent-day); color: #000; }
        
        .mute-toggle { cursor: pointer; color: var(--text-muted); font-size: 1.2rem; transition: color 0.2s; }
        .mute-toggle:hover { color: #fff; }

        /* --- Main Layout --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            overflow: hidden;
        }

        /* --- Sidebar: Game Log & Players --- */
        aside {
            background: rgba(0,0,0,0.2);
            border-right: 1px solid var(--border-noir);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-header { padding: 15px; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-noir); }

        .player-list { flex: 1; overflow-y: auto; padding: 10px; }
        .player-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.03);
            transition: transform 0.2s, background 0.2s;
        }
        .player-card.dead { opacity: 0.5; filter: grayscale(0.8); }
        .player-card.dead::after { content: '❌'; position: absolute; right: 10px; opacity: 0.5; }
        .player-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.8rem;
        }
        .player-meta { flex: 1; }
        .player-name { font-size: 0.9rem; font-weight: 600; }
        .player-role { font-size: 0.7rem; color: var(--text-muted); }

        /* --- Center Console: Action & Role Reveal --- */
        #game-canvas {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .role-reveal {
            perspective: 1000px;
            width: 250px;
            height: 350px;
            cursor: pointer;
        }
        .role-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .role-reveal.flipped .role-card-inner { transform: rotateY(180deg); }
        .role-card-front, .role-card-back {
            position: absolute;
            width: 100%; height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            border: 2px solid var(--border-noir);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .role-card-front { background: #16181c; }
        .role-card-back { background: #232428; transform: rotateY(180deg); padding: 20px; }
        
        .role-icon { width: 80px; height: 80px; margin-bottom: 20px; fill: var(--text-muted); }
        .role-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
        .role-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

        .tension-meter {
            width: 100%; max-width: 400px;
            height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 3px; margin-top: 40px;
            position: relative; overflow: hidden;
        }
        .tension-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #5865f2, #ed4245);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tension-bar.danger { animation: pulse-red 1s infinite; }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(237, 66, 69, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(237, 66, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(237, 66, 69, 0); }
        }

        /* --- Right Panel: Chat --- */
        #chat-panel {
            background: rgba(0,0,0,0.3);
            border-left: 1px solid var(--border-noir);
            display: flex;
            flex-direction: column;
        }

        .chat-tabs { display: flex; border-bottom: 1px solid var(--border-noir); }
        .chat-tab {
            flex: 1; padding: 12px; font-size: 0.7rem; font-weight: 800; cursor: pointer;
            text-align: center; color: var(--text-muted); transition: 0.2s;
            border-bottom: 2px solid transparent;
        }
        .chat-tab.active { color: #fff; border-bottom-color: var(--accent-primary); background: rgba(255,255,255,0.03); }
        .chat-tab.mafia { color: var(--accent-mafia); }
        .chat-tab.ghost { color: var(--accent-primary); font-style: italic; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .message { font-size: 0.85rem; line-height: 1.4; }
        .msg-author { font-weight: 800; margin-right: 5px; }
        .msg-text { color: #dbdee1; }
        .msg-ghost { font-style: italic; opacity: 0.7; }
        .msg-system { color: var(--accent-day); font-style: italic; font-size: 0.8rem; border-left: 2px solid var(--accent-day); padding-left: 10px; margin: 5px 0; }

        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-noir); }
        .chat-input-area input {
            width: 100%; background: #1e1f22; border: 1px solid #3f4147;
            padding: 10px 15px; border-radius: 8px; color: #fff; outline: none;
        }

        /* --- Modals & Overlays --- */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .parchment {
            background: #e9dcc9; color: #222; padding: 30px;
            border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-width: 400px; font-family: 'Georgia', serif; position: relative;
            transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .parchment.show { transform: scale(1); }
        
        .hidden { display: none !important; }

        /* --- Buttons --- */
        button { cursor: pointer; border: none; outline: none; font-family: inherit; transition: all 0.2s ease; }
        .btn-save {
            background: var(--accent-primary); color: white;
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }
        .btn-save:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5); background: #4752c4; }
        .btn-save:disabled { cursor: not-allowed; opacity: 0.6; transform: none; box-shadow: none; }
        .btn-save.active { background: var(--accent-town); color: #000; box-shadow: 0 4px 15px rgba(87, 242, 135, 0.3); }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 900px) {
            body {
                height: 100dvh; /* Or auto if we want it to expand */
                overflow: hidden; /* Keep hidden to allow internal flex scrolling */
            }
            main {
                display: flex;
                flex-direction: column;
                overflow-y: auto; /* Let the main content scroll */
            }
            aside {
                border-right: none;
                border-bottom: 1px solid var(--border-noir);
                min-height: 250px;
                max-height: 350px;
            }
            #chat-panel {
                border-left: none;
                border-top: 1px solid var(--border-noir);
                min-height: 350px;
                max-height: 500px;
            }
            #game-canvas {
                min-height: 400px;
                padding: 20px 10px;
            }
            .role-reveal {
                width: 200px;
                height: 280px;
            }
            header {
                padding: 10px 15px;
            }
            .game-info { gap: 10px; }
            .game-info h1 {
                font-size: 1.2rem;
            }
            .phase-badge {
                padding: 4px 8px;
            }
            #round-info, #timer-display {
                font-size: 0.8rem;
            }
        }

        /* --- SVG Roles Icons --- */
        .svg-defs { position: absolute; width: 0; height: 0; }
    </style>
</head>

    <header>
        <div class="game-info">
            <h1 id="game-title">MAFIA NOIR</h1>
            <span class="phase-badge">Lobby</span>
            <span id="round-info" class="hidden">Round 1</span>
            <span id="timer-display" class="hidden" style="background: rgba(237, 66, 69, 0.2); color: var(--accent-mafia); padding: 5px 10px; border-radius: 4px; font-weight: 800; border: 1px solid var(--accent-mafia); margin-left: 10px;">00:00</span>
        </div>
        <div class="user-meta" style="display: flex; gap: 15px; align-items: center;">
            <span id="my-name-display" style="font-weight: 800; font-size: 0.9rem; cursor: pointer; color: var(--accent-primary);" onclick="changeName()" title="Click to change name"></span>
            <span class="mute-toggle" onclick="toggleMute()"><i class="fas fa-volume-up"></i></span>
        </div>
    </header>

    <main>
        <aside>
            <div class="section-header">Players <span id="player-count">(0)</span></div>
            <div class="player-list" id="player-list">
                <!-- Players injected here -->
            </div>
            <div id="action-reports" class="hidden" style="padding: 15px; background: rgba(88, 101, 242, 0.1); border-top: 1px solid var(--border-noir); border-bottom: 2px solid var(--accent-primary);">
                <div class="section-header" style="padding-left: 0; border-bottom: none; margin-bottom: 5px; color: var(--accent-primary);">Night Report</div>
                <p id="report-text" style="font-size: 0.8rem; font-style: italic;"></p>

            <div class="chat-messages" id="game-log" style="font-size: 0.75rem; border-top: 1px solid var(--border-noir); padding-top: 10px;">
                <!-- System events here -->
            </div>

        <section id="game-canvas">
            <div class="role-reveal hidden" id="my-role-card" onclick="this.classList.toggle('flipped')">
                <div class="role-card-inner">
                    <div class="role-card-front">
                        <svg class="role-icon"><use xlink:href="#icon-villager"></use></svg>

                </div>

            <div id="lobby-wait" style="text-align: center;">
                <h2 style="font-size: 2rem; margin-bottom: 10px;">Lobby</h2>
                <p id="lobby-status" style="margin-bottom: 20px;">Waiting for players (min 5)...</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="btn-vote-start" class="btn-save" style="max-width: 250px; display: none;">
                        Vote to Start (0/0)
                    </button>
                    <button id="btn-leave-lobby" class="btn-save" style="max-width: 150px; background: #3f4147;">
                        Leave Lobby
                    </button>

        <aside id="chat-panel">
            <div class="chat-tabs">
                <div class="chat-tab active" data-channel="global">Global</div>
                <div class="chat-tab mafia hidden" data-channel="mafia">🔪 Mafia</div>
                <div class="chat-tab ghost hidden" data-channel="ghost">👻 Ghost</div>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- Messages here -->
            </div>

            </div>

    <div class="overlay hidden" id="death-overlay">
        <div class="parchment" id="last-words">
            <h3 style="margin-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px;">Last Words...</h3>
            <p id="death-message"></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        /* --- CORE CONFIG --- */
        const sessionId = window.location.pathname.split('/').pop();
        const apiBase = window.location.origin;
        let ws;
        let myId = localStorage.getItem(`mafia_id_${sessionId}`);
        let myToken = localStorage.getItem(`mafia_token_${sessionId}`);
        let myNickname = localStorage.getItem(`mafia_nickname_${window.location.hostname}`) || "";
        let isMuted = localStorage.getItem('mafia_mute') === 'true';
        let gameState = null;
        let currentChannel = 'global';
        let pollingActive = true;

        const ROLE_GUIDE = {
            "Villager": { emoji: "👤", desc: "Standard townie. Your only weapon is your vote." },
            "Detective": { emoji: "🔍", desc: "Investigate one player each night to find their team." },
            "Doctor": { emoji: "💊", desc: "Protect one player each night from being killed." },
            "Vigilante": { emoji: "🔫", desc: "Kill one player per game at night. Use it wisely." },
            "Mafia": { emoji: "🔪", desc: "Collaborate with other Mafia to kill one townie each night." },
            "Framer": { emoji: "🎭", desc: "Frame one player each night. If investigated, they appear as Mafia." },
            "Jester": { emoji: "🃏", desc: "Win by getting lynched by the town during the day." }
        };

        /* --- AUDIO ENGINE (Web Audio API) --- */
        let AudioCtx = null;
        let mainGain = null;

        function getAudioCtx() {
            if (!AudioCtx) {
                AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                mainGain = AudioCtx.createGain();
                mainGain.connect(AudioCtx.destination);
                mainGain.gain.value = isMuted ? 0 : 0.4;
            }
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            return AudioCtx;
        }

        function playArpeggio() {
            const ctx = getAudioCtx();
            const freqs = [523.25, 659.25, 783.99]; // C5, E5, G5
            freqs.forEach((f, i) => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f, ctx.currentTime + i*0.08);
                g.gain.setValueAtTime(0.3, ctx.currentTime + i*0.08);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i*0.08 + 0.3);
                osc.connect(g); g.connect(mainGain);
                osc.start(ctx.currentTime + i*0.08);
                osc.stop(ctx.currentTime + i*0.08 + 0.4);
            });
        }

        function playDrone() {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.frequency.value = 60;
            g.gain.setValueAtTime(0, ctx.currentTime);
            g.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 3);
            g.gain.linearRampToValueAtTime(0, ctx.currentTime + 5);
            osc.connect(g); g.connect(mainGain);
            osc.start(); osc.stop(ctx.currentTime + 5);
        }

        function playSweep() {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(196, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(392, ctx.currentTime + 1.5);
            g.gain.setValueAtTime(0.1, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
            osc.connect(g); g.connect(mainGain);
            osc.start(); osc.stop(ctx.currentTime + 1.5);
        }

        function playClick() {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const bufferSize = ctx.sampleRate * 0.03;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const g = ctx.createGain();
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.03);
            noise.connect(g); g.connect(mainGain);
            noise.start();
        }

        function playTick(intensity) {
            if (isMuted) return;
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(60, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 0.05);
            g.gain.setValueAtTime(0.1 + (intensity * 0.1), ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
            osc.connect(g); g.connect(mainGain);
            osc.start(); osc.stop(ctx.currentTime + 0.05);
        }

        function playBell() {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.frequency.value = 110; // A2
            g.gain.setValueAtTime(0.5, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2);
            osc.connect(g); g.connect(mainGain);
            osc.start(); osc.stop(ctx.currentTime + 2);
        }


        /* --- INITIALIZATION --- */
        async function init() {
            try {
                if (!myNickname) {
                    myNickname = prompt("Enter a nickname for this session:");
                    if (!myNickname) myNickname = "Player_" + Math.floor(Math.random()*1000);
                    localStorage.setItem(`mafia_nickname_${window.location.hostname}`, myNickname);
                }
                document.getElementById('my-name-display').innerText = myNickname;

                if (!myId || !myToken) {
                    // Register via API
                    const dummyId = Math.floor(Math.random() * 1000000);
                    const res = await fetch(`${apiBase}/mafia/${sessionId}/join`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: dummyId, nickname: myNickname })
                    });
                    
                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.error || "Failed to join session");
                    }
                    
                    const data = await res.json();
                    myId = String(data.player_id); 
                    myToken = data.token;
                    localStorage.setItem(`mafia_id_${sessionId}`, myId);
                    localStorage.setItem(`mafia_token_${sessionId}`, myToken);
                }

                connect();
                startPolling();
            } catch (err) {
                console.error(err);
                document.getElementById('lobby-status').innerText = "⚠️ Error: " + err.message;
                document.getElementById('lobby-status').style.color = "var(--accent-mafia)";
            }
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/mafia/ws/${sessionId}`);
            
            ws.onopen = () => {
                ws.send(jsonStr({ type: 'identify', player_id: myId, rejoin_token: myToken }));
                console.log("WebSocket connected.");
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                handleEvent(msg.type, msg.data);
            };

            ws.onclose = () => setTimeout(connect, 3000);
        }

        let timerInterval;
        function startUITimer(endTime) {
            clearInterval(timerInterval);
            const display = document.getElementById('timer-display');
            display.classList.remove('hidden');
            
            function update() {
                const now = Date.now() / 1000;
                const remaining = Math.max(0, Math.floor(endTime - now));
                
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                if (remaining <= 10) {
                    display.style.animation = 'pulse-red 0.5s infinite';
                    if (remaining > 0) playTick(1.0 - (remaining / 10)); // Accelerating intensity
                } else {
                    display.style.animation = 'none';
                    if (remaining > 0 && remaining % 2 === 0) playTick(0.2);
                }
                
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    display.classList.add('hidden');
                }
            }
            update();
            timerInterval = setInterval(update, 1000);
        }

        let pollTimeout;
        function triggerImmediatePoll() {
            clearTimeout(pollTimeout);
            startPolling();
        }

        async function startPolling() {
            if (!pollingActive) return;
            
            // Periodic full state sync
            try {
                const res = await fetch(`${apiBase}/mafia/${sessionId}/state?player_id=${myId}`);
                if (res.ok) {
                    const data = await res.json();
                    updateUI(data);
                    if (data.phase === 'ended') {
                        pollingActive = false;
                        return;
                    }
                }
            } catch(e) {}
            pollTimeout = setTimeout(startPolling, 5000);
        }

        /* --- EVENT HANDLING --- */
        function handleEvent(type, data) {
            console.log("Event:", type, data);
            switch(type) {
                case 'phase_change':
                    document.body.className = `phase-${data.phase}`;
                    document.querySelector('.phase-badge').innerText = data.phase;
                    addLog(data.message);
                    if (data.phase === 'night') playDrone();
                    if (data.phase === 'day') playSweep();
                    // Hide lobby UI if game started
                    if (data.phase !== 'lobby') document.getElementById('lobby-wait').classList.add('hidden');
                    
                    // State refresh to get new end_times
                    triggerImmediatePoll();
                    break;
                case 'player_died':
                    addLog(`${data.nickname} died (${data.cause}). They were ${data.role_revealed}.`);
                    playBell();
                    showParchment(`${data.nickname} has met their end. Role: ${data.role_revealed}`);
                    break;
                case 'vote_update':
                    if (data.type === 'start_vote') {
                        updateStartVoteUI(data.count, data.threshold);
                    } else if (data.votes) {
                        updateTension(data.votes);
                    }
                    playClick();
                    break;
                case 'chat_message':
                    addMessage(data);
                    playChatPop();
                    break;
                case 'game_over':
                    showParchment(`Game Over! Winner: ${data.winner.toUpperCase()}\n\n${data.reason}`);
                    break;
                case 'name_changed':
                    if (String(data.player_id) === String(myId)) {
                        myNickname = data.new_name;
                        localStorage.setItem(`mafia_nickname_${window.location.hostname}`, myNickname);
                        document.getElementById('my-name-display').innerText = myNickname;
                    }
                    addLog(`${data.old_name} is now known as ${data.new_name}.`);
                    triggerImmediatePoll();
                    break;
            }
        }

        function updateUI(state) {
            gameState = state;
            
            // Timer handling
            if (state.phase !== 'lobby' && state.phase !== 'ended' && state.phase_end_time) {
                startUITimer(state.phase_end_time);
            } else {
                clearInterval(timerInterval);
                document.getElementById('timer-display').classList.add('hidden');
            }

            // Player list
            const list = document.getElementById('player-list');
            list.innerHTML = "";
            let aliveCount = 0;
            
            Object.values(state.players).forEach(p => {
                if (p.alive) aliveCount++;
                const card = document.createElement('div');
                card.className = `player-card ${p.alive ? '' : 'dead'}`;
                
                const initials = p.display_name.substring(0,2).toUpperCase();
                const color = stringToColor(p.display_name);
                
                const avatar = document.createElement('div');
                avatar.className = 'player-avatar';
                avatar.style.background = color;
                avatar.textContent = initials;
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'player-name';
                nameDiv.textContent = p.display_name + (String(p.user_id) === String(myId) ? ' (You)' : '');
                
                const roleDiv = document.createElement('div');
                roleDiv.className = 'player-role';
                roleDiv.textContent = state.phase === 'lobby' ? 'Waiting...' : p.role;
                
                const meta = document.createElement('div');
                meta.className = 'player-meta';
                meta.appendChild(nameDiv);
                meta.appendChild(roleDiv);
                
                card.appendChild(avatar);
                card.appendChild(meta);
                
                list.appendChild(card);
            });
            document.getElementById('player-count').innerText = `(${Object.keys(state.players).length})`;

            // Active UI components
            const me = state.players[String(myId)];
            
            if (state.phase === 'lobby') {
                const count = Object.keys(state.players).length;
                    const threshold = Math.ceil(count * 0.75);
                    const votedCount = state.start_votes ? state.start_votes.length : 0;
                    updateStartVoteUI(votedCount, threshold);
                    
                    if (count >= 5) {
                        const btn = document.getElementById('btn-vote-start');
                        btn.style.display = 'block';
                        // Bug 15: Compare using strings
                        if (state.start_votes && state.start_votes.map(String).includes(String(myId))) {
                            btn.innerText = `Voted to Start (${votedCount}/${threshold})`;
                            btn.disabled = true;
                            btn.style.opacity = 0.6;
                        } else {
                            btn.innerText = `Vote to Start (${votedCount}/${threshold})`;
                            btn.disabled = false;
                            btn.style.opacity = 1;
                        }
                    }
            } else {
                document.getElementById('lobby-wait').classList.add('hidden');
                document.getElementById('vote-prompt').classList.remove('hidden');
                document.getElementById('round-info').innerText = `Round ${state.round}`;
                document.getElementById('round-info').classList.remove('hidden');
                
                // Show my role
                if (me) {
                    document.getElementById('my-role-card').classList.remove('hidden');
                    document.getElementById('assigned-role-name').innerText = me.role;
                    document.getElementById('assigned-icon').querySelector('use').setAttribute('xlink:href', `#icon-${me.role.toLowerCase()}`);
                    
                    // Fix description
                    const guide = ROLE_GUIDE[me.role];
                    if (guide) document.getElementById('assigned-role-desc').innerText = guide.desc;

                    // Report handling
                    const reportBox = document.getElementById('action-reports');
                    if (me.last_result) {
                        reportBox.classList.remove('hidden');
                        document.getElementById('report-text').innerText = me.last_result;
                    } else {
                        reportBox.classList.add('hidden');
                    }

                    // Render interactive buttons
                    renderActions(state, me);
                }
            }

            // Tabs visibilty
            if (me) {
                if (me.role === 'Mafia') document.querySelector('.chat-tab.mafia').classList.remove('hidden');
                if (!me.alive) document.querySelector('.chat-tab.ghost').classList.remove('hidden');
            } else {
                // Spectator
                document.querySelector('.chat-tab.ghost').classList.remove('hidden');
            }
        }

        /* --- UI HELPERS --- */
        function addLog(text) {
            const log = document.getElementById('game-log');
            const entry = document.createElement('div');
            entry.className = 'msg-system';
            entry.innerText = text;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function addMessage(msg) {
            const chat = document.getElementById('chat-messages');
            const el = document.createElement('div');
            el.className = `message ${msg.is_ghost ? 'msg-ghost' : ''}`;
            const color = stringToColor(msg.nickname);
            
            // Bug 6: Use textContent instead of innerHTML for XSS protection
            const author = document.createElement('span');
            author.className = 'msg-author';
            author.style.color = color;
            let prefix = '';
            if (msg.channel === 'mafia') prefix = '🔪 [Mafia] ';
            else if (msg.channel === 'ghost') prefix = '👻 [Ghost] ';
            author.textContent = prefix + msg.nickname + ':';
            
            const text = document.createElement('span');
            text.className = 'msg-text';
            text.textContent = msg.text;
            
            el.appendChild(author);
            el.appendChild(text);
            chat.appendChild(el);
            chat.scrollTop = chat.scrollHeight;
        }

        function updateTension(votes) {
            const bar = document.getElementById('tension-bar');
            let maxVotes = 0;
            const voteArr = Object.values(votes);
            if (voteArr.length > 0) {
                maxVotes = Math.max(...voteArr);
            }
            
            const count = Object.keys(gameState?.players || {}).filter(k => gameState.players[k].alive).length;
            const threshold = Math.floor(count / 2) + 1;
            
            const percent = Math.min((maxVotes / threshold) * 100, 100);
            bar.style.width = percent + '%';
            bar.classList.toggle('danger', percent >= 80);
        }

        function renderActions(state, me) {
            const container = document.getElementById('vote-buttons');
            const title = document.getElementById('action-title');
            
            if (!me.alive) {
                title.innerText = "You are a ghost. Observe and whisper.";
                container.innerHTML = "";
                return;
            }

            let candidates = [];
            let actionType = 'vote';

            if (state.phase === 'day') {
                title.innerText = "Who should the town execute?";
                candidates = Object.values(state.players).filter(p => p.alive);
                actionType = 'vote';
            } else if (state.phase === 'night') {
                actionType = 'night_action';
                const config = {
                    "Mafia": { title: "Which soul will you eliminate?", icon: "⚔️" },
                    "Doctor": { title: "Who will you protect tonight?", icon: "🛡️" },
                    "Detective": { title: "Who will you investigate?", icon: "🔍" },
                    "Vigilante": { title: "Take your shot? (Leave blank to pass)", icon: "🔫" }
                };
                
                if (config[me.role]) {
                    title.innerText = config[me.role].title;
                    candidates = Object.values(state.players).filter(p => p.alive);
                    
                    // Special rules
                    // Bug 11: Explicit type coercion for ID comparisons
                    if (me.role === 'Doctor') {
                        // Can't self-protect back to back
                        candidates = candidates.filter(p => String(p.user_id) !== String(me.last_protected));
                    }
                    if (me.role === 'Detective' || me.role === 'Mafia') {
                        // Don't target self
                        candidates = candidates.filter(p => String(p.user_id) !== String(me.user_id));
                    }
                } else {
                    title.innerText = "The night is long. Sleep safe...";
                    container.innerHTML = "";
                    return;
                }
            }

            container.innerHTML = "";
            candidates.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'btn-save'; // Reuse existing dashboard button style or similar
                btn.style.padding = '8px 15px';
                btn.style.fontSize = '0.8rem';
                btn.innerText = p.display_name;
                
                // Bug 16: Normalize keys for vote lookup
                const sId = String(myId);
                const currentSelection = (state.phase === 'day') 
                    ? String(state.day_votes[sId] ?? "")
                    : (me.role === 'Mafia' 
                        ? String(state.mafia_votes[sId] ?? "") 
                        : String(state.night_actions[sId] ?? ""));
                
                if (currentSelection === String(p.user_id)) {
                    btn.style.background = 'var(--accent-primary)';
                    btn.classList.add('active');
                }

                btn.onclick = () => submitAction(p.user_id, actionType);
                container.appendChild(btn);
            });
        }

        async function submitAction(targetId, type) {
            playClick();
            const res = await fetch(`${apiBase}/mafia/${sessionId}/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_id: myId,
                    rejoin_token: myToken,
                    action_type: type,
                    target_id: targetId
                })
            });
            if (res.ok) {
                addLog(`Action submitted.`);
                triggerImmediatePoll(); // Refresh state immediately
            }
        }

        function showParchment(text) {
            const overlay = document.getElementById('death-overlay');
            const paper = document.getElementById('last-words');
            document.getElementById('death-message').innerText = text;
            overlay.classList.remove('hidden');
            setTimeout(() => paper.classList.add('show'), 10);
            setTimeout(() => {
                paper.classList.remove('show');
                setTimeout(() => overlay.classList.add('hidden'), 500);
            }, 8000);
        }

        function updateStartVoteUI(count, threshold) {
            const btn = document.getElementById('btn-vote-start');
            if (gameState && gameState.phase === 'lobby') {
                if (Object.keys(gameState.players).length >= 5) {
                    btn.style.display = 'block';
                    if (gameState.start_votes && gameState.start_votes.map(String).includes(String(myId))) {
                        btn.innerText = `Voted to Start (${count}/${threshold})`;
                    } else {
                        btn.innerText = `Vote to Start (${count}/${threshold})`;
                    }
                }
            }
        }
        
        document.getElementById('btn-vote-start').onclick = async () => {
            const res = await fetch(`${apiBase}/mafia/${sessionId}/vote_start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_id: myId })
            });
            if (res.ok) {
                document.getElementById('btn-vote-start').disabled = true;
                document.getElementById('btn-vote-start').style.opacity = 0.6;
                addLog("You voted to start the game.");
            }
        };

        document.getElementById('btn-leave-lobby').onclick = async () => {
            if (!confirm("Are you sure you want to leave the lobby?")) return;
            try {
                const res = await fetch(`${apiBase}/mafia/${sessionId}/leave`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_id: myId, rejoin_token: myToken })
                });
                if (res.ok) {
                    localStorage.removeItem(`mafia_id_${sessionId}`);
                    localStorage.removeItem(`mafia_token_${sessionId}`);
                    window.location.reload();
                } else {
                    const err = await res.json();
                    alert("Error: " + (err.error || "Unknown"));
                }
            } catch (e) {
                alert("Network error.");
            }
        };

        /* --- UTILS --- */
        function jsonStr(obj) { return JSON.stringify(obj); }
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${hash % 360}, 60%, 40%)`;
        }
        function playChatPop() {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.frequency.value = 880;
            g.gain.setValueAtTime(0.05, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(g); g.connect(mainGain);
            osc.start(); osc.stop(ctx.currentTime + 0.08);
        }

        function toggleMute() {
            isMuted = !isMuted;
            localStorage.setItem('mafia_mute', isMuted);
            document.querySelector('.mute-toggle i').className = isMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
            // Bug 2: Only touch mainGain if audio context exists
            if (mainGain) {
                mainGain.gain.value = isMuted ? 0 : 0.4;
            }
        }

        async function changeName() {
            let newName = prompt("Enter new nickname:", myNickname);
            if (!newName || newName.trim() === "" || newName === myNickname) return;
            newName = newName.trim().substring(0, 32);
            
            try {
                const res = await fetch(`${apiBase}/mafia/${sessionId}/change_name`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_id: myId, rejoin_token: myToken, nickname: newName })
                });
                
                if (res.ok) {
                    addLog(`Requesting name change to ${newName}...`);
                } else {
                    const err = await res.json();
                    alert("Error changing name: " + (err.error || "Unknown"));
                }
            } catch (e) {
                alert("Network error.");
            }
        }

        /* --- INPUT --- */
        document.querySelectorAll('.chat-tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentChannel = tab.dataset.channel;
                addLog(`Switched to ${currentChannel} channel.`);
            };
        });

        document.getElementById('chat-input').onkeydown = (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                ws.send(jsonStr({
                    type: 'chat',
                    player_id: myId,
                    rejoin_token: myToken,
                    text: e.target.value,
                    channel: currentChannel
                }));
                e.target.value = "";
            }
        };

        init();
    </script>
</body>
